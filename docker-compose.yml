# Full local/production-like stack: PostgreSQL + Redis + web app + alert worker.
#   docker compose up -d db redis          # just the infrastructure (run the app with npm)
#   docker compose up -d --build           # everything
# Secrets come from .env (see .env.example). DATABASE_URL / REDIS_URL are overridden for the containers.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_alerts
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_alerts"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/telegram_alerts
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: .
    command: ["npm", "run", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/telegram_alerts
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/database"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/telegram_alerts
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
